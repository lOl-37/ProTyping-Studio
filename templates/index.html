<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTyping Studio - Professional Tez Yozish Trenajyori</title>
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --card-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #a0aec0;
            --primary: #6c5ce7;
            --primary-hover: #5649c0;
            --success-bg: #c6f6d5;
            --success-text: #2f855a;
            --error-bg: #fed7d7;
            --error-text: #c53030;
            --box-bg: #edf2f7;
            --border-color: #cbd5e0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            width: 850px;
            background: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 26px;
            text-align: center;
        }
        .settings {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .settings select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid var(--border-color);
            font-size: 14px;
            outline: none;
            cursor: pointer;
            background: #fff;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 16px;
            font-weight: bold;
            color: #2d3748;
            background: #f7fafc;
            padding: 12px;
            border-radius: 8px;
        }
        #text-box {
            font-size: 19px;
            line-height: 1.8;
            text-align: left;
            background: var(--box-bg);
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 120px;
            max-height: 220px;
            overflow-y: auto;
            letter-spacing: 0.5px;
            user-select: none;
            word-break: break-word;
        }
        .char {
            color: var(--text-muted);
        }
        .char.correct {
            color: var(--success-text);
            background: var(--success-bg);
        }
        .char.incorrect {
            color: var(--error-text);
            background: var(--error-bg);
        }
        .char.current {
            border-left: 2px solid #3182ce;
            animation: blink 1s infinite;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: var(--primary);
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 20px;
        }
        .restart-btn {
            padding: 10px 25px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.3s;
        }
        .restart-btn:hover {
            background: #38a169;
        }
        .card {
            margin-top: 25px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        .card h3 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #4a5568;
            text-align: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }
        th, td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #e2e8f0;
        }
        th {
            color: #718096;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ProTyping Studio - Trenajyor</h2>
    
    <div class="settings">
        <select id="lang-select" onchange="generateNewSession()">
            <option value="uz" selected>O'zbekcha</option>
            <option value="ru">Русский</option>
            <option value="en">English</option>
        </select>
        <select id="topic-select" onchange="generateNewSession()">
            <option value="school">Maktab va Ta'lim</option>
            <option value="sport">Sport</option>
            <option value="math">Matematika</option>
            <option value="life">Hayotiy</option>
        </select>
        <select id="size-select" onchange="generateNewSession()">
            <option value="short">Qisqa</option>
            <option value="medium" selected>O'rta</option>
            <option value="long">Uzun</option>
        </select>
    </div>

    <div class="stats">
        <div>Tezlik (WPM): <span id="wpm">0</span></div>
        <div>Xatolar: <span id="errors">0</span></div>
        <div>Aniqlik: <span id="accuracy">100</span>%</div>
        <div>Vaqt: <span id="timer">0</span>s</div>
    </div>

    <div id="text-box">Yuklanmoqda...</div>
    
    <input type="text" id="input-box" placeholder="Matnni bu yerga yozishni boshlang..." autofocus autocomplete="off">
    
    <div class="controls">
        <button class="restart-btn" onclick="resetTest()">Qayta boshlash</button>
    </div>

    <div class="card">
        <h3>Eng yaxshi natijalar reytingi</h3>
        <table>
            <thead>
                <tr>
                    <th>№</th>
                    <th>Tezlik (WPM)</th>
                    <th>Xatolar</th>
                </tr>
            </thead>
            <tbody id="leaderboard-body">
                <tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Hali natijalar yo'q</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    const database = {
        uz: {
            school: [
                "Maktabda har kuni qiziqarli darslar bo'lib o'tadi va o'quvchilar yangi bilimlar olishadi.",
                "Ustozlarimiz bizga zamonaviy fanlar, kompyuter texnologiyalari va dasturlash asoslarini o'rgatishadi.",
                "Kutubxonada ko'plab foydali kitoblar, ilmiy qo'llanmalar va adabiyotlar mavjud bo'lib, ulardan hamma foydalanishi mumkin."
            ],
            sport: [
                "Futbol jamoasi stadionda navbatdagi muhim g'alaba uchun astoydil kurash olib bormoqda.",
                "Sportchi har kuni ertalab yugurish mashqlarini bajarib, o'zining jismoniy holatini yaxshilab boradi.",
                "Musobaqa yakunida barcha g'oliblarga maxsus kuboklar va qimmatbaho medallar tantanali ravishda topshirildi."
            ],
            math: [
                "Matematika fanida murakkab tenglamalarni yechish va misollar bajarish mantiqiy fikrlashni kuchaytiradi.",
                "Kalkulyator yordamida sonlarning ko'paytirish, bo'lish hamda foiz hisoblash amallari juda tez bajariladi."
            ],
            life: [
                "Har bir inson o'z oldiga aniq maqsadlar qo'yib, ularga erishish uchun tinimsiz harakat qilishi lozim.",
                "Tinch va osuda hayot kechirish, tabiat go'zalliklaridan zavqlanish har bir insonga baxt keltiradi."
            ]
        },
        ru: {
            school: [
                "В школе каждый день проходят интересные уроки, на которых ученики получают полезные знания.",
                "Учителя объясняют сложные темы и помогают студентам успешно осваивать современные технологии."
            ],
            sport: [
                "Футбольная команда вышла на поле стадиона, чтобы побороться за главный кубок турнира.",
                "Ежедневные тренировки помогают спортсменам улучшать свои результаты и ставить новые рекорды."
            ],
            math: [
                "Решение математических уравнений и логических задач отлично развивает мышление и внимание.",
                "Современные технологии и калькуляторы позволяют быстро выполнять любые сложные вычисления."
            ],
            life: [
                "Каждый новый день открывает перед нами уникальные возможности для достижения поставленных целей.",
                "Проведение времени с близкими людьми наполняет нашу жизнь радостью, теплом и гармонией."
            ]
        },
        en: {
            school: [
                "Students attend interesting lessons every day and acquire valuable knowledge for their future career.",
                "Teachers guide students through complex subjects like computer science, mathematics, and programming."
            ],
            sport: [
                "The football team played an amazing match at the central stadium to win the championship cup.",
                "Regular training sessions help every athlete to improve physical strength and achieve great results."
            ],
            math: [
                "Solving complex mathematical equations and logical problems helps to develop critical thinking.",
                "Students use modern tools and calculators to calculate numbers and percentages quickly and accurately."
            ],
            life: [
                "Setting clear goals in life and working hard every day leads to incredible personal success.",
                "Enjoying peaceful moments with family and friends brings true happiness and endless positive energy."
            ]
        }
    };

    let originalText = "";
    let timer = null;
    let seconds = 0;
    let started = false;
    let errors = 0;

    const textBox = document.getElementById("text-box");
    const inputBox = document.getElementById("input-box");
    const wpmDisplay = document.getElementById("wpm");
    const errorsDisplay = document.getElementById("errors");
    const accuracyDisplay = document.getElementById("accuracy");
    const timerDisplay = document.getElementById("timer");

    function generateNewSession() {
        const lang = document.getElementById("lang-select").value;
        const topic = document.getElementById("topic-select").value;
        const size = document.getElementById("size-select").value;

        const paragraphs = database[lang][topic];
        let selectedText = "";

        if (size === "short") {
            selectedText = paragraphs[0];
        } else if (size === "medium") {
            selectedText = paragraphs.slice(0, 2).join(" ");
        } else {
            selectedText = paragraphs.join(" ");
        }

        originalText = selectedText;
        initText(originalText);
        resetTestState();
    }

    function initText(txt) {
        textBox.innerHTML = txt.split("").map(char => `<span class="char">${char}</span>`).join("");
        if (textBox.children.length > 0) {
            textBox.children[0].classList.add("current");
        }
    }

    function resetTestState() {
        clearInterval(timer);
        seconds = 0;
        started = false;
        errors = 0;
        timerDisplay.innerText = "0";
        wpmDisplay.innerText = "0";
        errorsDisplay.innerText = "0";
        accuracyDisplay.innerText = "100";
        inputBox.value = "";
        inputBox.disabled = false;
        inputBox.focus();
    }

    inputBox.addEventListener("input", () => {
        if (!started) {
            started = true;
            timer = setInterval(() => {
                seconds++;
                timerDisplay.innerText = seconds;
                let typedChars = inputBox.value.length;
                let words = typedChars / 5;
                let minutes = seconds / 60;
                if (minutes > 0) {
                    wpmDisplay.innerText = Math.round(words / minutes);
                }
            }, 1000);
        }

        const val = inputBox.value;
        const charElements = textBox.querySelectorAll(".char");
        errors = 0;

        charElements.forEach((el, index) => {
            el.classList.remove("correct", "incorrect", "current");
            if (index < val.length) {
                if (val[index] === originalText[index]) {
                    el.classList.add("correct");
                } else {
                    el.classList.add("incorrect");
                    errors++;
                }
            } else if (index === val.length) {
                el.classList.add("current");
            }
        });

        errorsDisplay.innerText = errors;
        
        let totalTyped = val.length;
        if (totalTyped > 0) {
            let accuracy = Math.max(0, Math.round(((totalTyped - errors) / totalTyped) * 100));
            accuracyDisplay.innerText = accuracy;
        }

        if (val.length >= originalText.length) {
            clearInterval(timer);
            inputBox.disabled = true;
            saveScore();
        }
    });

    function resetTest() {
        generateNewSession();
    }

    async function saveScore() {
        let wpm = parseInt(wpmDisplay.innerText);
        await fetch('/save-score', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ wpm: wpm, errors: errors })
        });
        loadLeaderboard();
    }

    function loadLeaderboard() {
        fetch('/get-scores')
            .then(res => res.json())
            .then(data => {
                const tbody = document.getElementById("leaderboard-body");
                tbody.innerHTML = "";
                if (!data || data.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--text-muted);">Hali natijalar yo'q</td></tr>`;
                    return;
                }
                data.forEach((item, index) => {
                    tbody.innerHTML += `<tr><td>${index + 1}</td><td>${item.wpm} WPM</td><td>${item.errors}</td></tr>`;
                });
            }).catch(err => console.log(err));
    }

    generateNewSession();
    loadLeaderboard();
</script>

</body>
</html>
