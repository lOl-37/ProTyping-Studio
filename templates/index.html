<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProTyping Studio - Professional Tez Yozish Trenajyori</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 800px;
            background: #ffffff;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        h2 {
            color: #4a5568;
            margin-bottom: 20px;
            font-size: 26px;
        }
        .buttons {
            margin-bottom: 25px;
        }
        .buttons button {
            padding: 10px 20px;
            margin: 0 6px;
            cursor: pointer;
            border: none;
            background: #6c5ce7;
            color: white;
            border-radius: 8px;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.3s;
        }
        .buttons button:hover {
            background: #5649c0;
        }
        .stats {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #2d3748;
            background: #f7fafc;
            padding: 12px;
            border-radius: 8px;
        }
        #text-box {
            font-size: 20px;
            line-height: 1.8;
            text-align: left;
            background: #edf2f7;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            min-height: 120px;
            letter-spacing: 0.5px;
            user-select: none;
            word-break: break-word;
        }
        .char {
            color: #a0aec0;
        }
        .char.correct {
            color: #2f855a;
            background: #c6f6d5;
        }
        .char.incorrect {
            color: #c53030;
            background: #fed7d7;
        }
        .char.current {
            border-left: 2px solid #3182ce;
            animation: blink 1s infinite;
        }
        input[type="text"] {
            width: 100%;
            padding: 14px;
            font-size: 18px;
            border: 2px solid #cbd5e0;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="text"]:focus {
            border-color: #6c5ce7;
        }
        .restart-btn {
            margin-top: 20px;
            padding: 10px 25px;
            background: #48bb78;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        .restart-btn:hover {
            background: #38a169;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>ProTyping Studio - Trenajyor</h2>
    
    <!-- Uzunlikni tanlash tugmalari -->
    <div class="buttons">
        <button onclick="changeTextLength(50)">50 ta so'z</button>
        <button onclick="changeTextLength(100)">100 ta so'z</button>
        <button onclick="changeTextLength(150)">150 ta so'z</button>
    </div>

    <div class="stats">
        <div>WPM (Tezlik): <span id="wpm">0</span></div>
        <div>Xatolar: <span id="errors">0</span></div>
        <div>Vaqt: <span id="timer">0</span>s</div>
    </div>

    <div id="text-box">Yuklanmoqda...</div>
    
    <input type="text" id="input-box" placeholder="Matnni bu yerga yozishni boshlang..." autofocus autocomplete="off">
    
    <div>
        <button class="restart-btn" onclick="resetTest()">Qayta boshlash</button>
    </div>
</div>

<script>
    let originalText = "{{ text }}";
    let timer = null;
    let seconds = 0;
    let started = false;
    let errors = 0;

    const textBox = document.getElementById("text-box");
    const inputBox = document.getElementById("input-box");
    const wpmDisplay = document.getElementById("wpm");
    const errorsDisplay = document.getElementById("errors");
    const timerDisplay = document.getElementById("timer");

    function initText(txt) {
        originalText = txt;
        textBox.innerHTML = originalText.split("").map(char => `<span class="char">${char}</span>`).join("");
        if (textBox.children.length > 0) {
            textBox.children[0].classList.add("current");
        }
    }

    async function changeTextLength(count) {
        let response = await fetch(`/get-text/${count}`);
        let data = await response.json();
        resetTest();
        initText(data.text);
    }

    inputBox.addEventListener("input", () => {
        if (!started) {
            started = true;
            timer = setInterval(() => {
                seconds++;
                timerDisplay.innerText = seconds;
                let typedChars = inputBox.value.length;
                let words = typedChars / 5;
                let minutes = seconds / 60;
                if (minutes > 0) {
                    wpmDisplay.innerText = Math.round(words / minutes);
                }
            }, 1000);
        }

        const val = inputBox.value;
        const charElements = textBox.querySelectorAll(".char");
        errors = 0;

        charElements.forEach((el, index) => {
            el.classList.remove("correct", "incorrect", "current");
            if (index < val.length) {
                if (val[index] === originalText[index]) {
                    el.classList.add("correct");
                } else {
                    el.classList.add("incorrect");
                    errors++;
                }
            } else if (index === val.length) {
                el.classList.add("current");
            }
        });

        errorsDisplay.innerText = errors;

        if (val.length >= originalText.length) {
            clearInterval(timer);
            inputBox.disabled = true;
            saveScore();
        }
    });

    function resetTest() {
        clearInterval(timer);
        seconds = 0;
        started = false;
        errors = 0;
        timerDisplay.innerText = "0";
        wpmDisplay.innerText = "0";
        errorsDisplay.innerText = "0";
        inputBox.value = "";
        inputBox.disabled = false;
        initText(originalText);
        inputBox.focus();
    }

    async function saveScore() {
        let wpm = parseInt(wpmDisplay.innerText);
        await fetch('/save-score', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ wpm: wpm, errors: errors })
        });
    }

    // Sahifa yuklanganda ishga tushirish
    initText(originalText);
</script>

</body>
</html>
